<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anjali Pal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Anjali Pal — UI/UX product designer and filmmaker. Pick a lane.">
<meta name="author" content="Anjali Pal">
<link rel="canonical" href="https://ianjalipal.github.io/anjali-portfolio/">
<meta property="og:type" content="website">
<meta property="og:title" content="Anjali Pal">
<meta property="og:description" content="UI/UX product designer and filmmaker. Pick a lane.">
<meta property="og:url" content="https://ianjalipal.github.io/anjali-portfolio/">
<meta name="theme-color" content="#FAFAF7">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='9'%20fill='%23111114'/%3E%3Ctext%20x='16'%20y='22'%20font-family='Inter,Arial,sans-serif'%20font-weight='700'%20font-size='14'%20text-anchor='middle'%20fill='%23fff'%3EAP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181F;
    --grey:#6B7280;
    --bg:#FAFAF7;
    --design:#4F7CFF;
    --design-soft:#EDF1FF;
    --film:#C98A2E;
    --film-soft:#FBF0DD;
    --font:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --hand:"Caveat","Inter",cursive;
    --serif:"Instrument Serif",Georgia,serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .scene{
    position:relative; min-height:100vh; min-height:100dvh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(20px,5vw,48px);
    background:
      radial-gradient(60% 55% at 18% 30%, rgba(79,124,255,.14), transparent 70%),
      radial-gradient(60% 55% at 82% 72%, rgba(201,138,46,.16), transparent 70%),
      var(--bg);
  }

  .mark{ position:absolute; top:clamp(16px,3vw,28px); left:clamp(16px,3vw,28px); font-weight:800; font-size:14px; letter-spacing:-.02em; color:var(--ink); opacity:.7; }
  .contact{ position:absolute; bottom:clamp(16px,3vw,28px); font-size:12.5px; font-weight:600; color:var(--grey); }
  .contact a{ color:var(--grey); text-decoration:none; }
  .contact a:hover{ color:var(--ink); }

  .intro{ text-align:center; margin-bottom:clamp(28px,5vw,48px); }
  .intro h1{
    font-family:var(--serif); font-style:italic; font-weight:400; letter-spacing:-.01em;
    font-size:clamp(34px,6vw,58px); margin:0 0 6px; line-height:1;
  }
  .intro p{ font-family:var(--hand); font-size:clamp(17px,2.2vw,21px); color:var(--grey); margin:0; }

  .picks{
    display:flex; gap:clamp(20px,4vw,56px); align-items:flex-end; justify-content:center;
    width:100%; max-width:860px;
  }
  .pick{
    flex:1 1 0; display:flex; flex-direction:column; align-items:center; text-align:center;
    text-decoration:none; color:inherit; cursor:pointer; min-width:0;
    padding:clamp(16px,2.6vw,28px) clamp(10px,2vw,18px) clamp(20px,3vw,28px);
    border-radius:28px; transition:transform .25s cubic-bezier(.2,.8,.3,1), background .25s ease;
  }
  .pick:hover, .pick:focus-visible{ transform:translateY(-6px); }
  .pick.design:hover, .pick.design:focus-visible{ background:var(--design-soft); }
  .pick.film:hover, .pick.film:focus-visible{ background:var(--film-soft); }
  .pick img{
    width:100%; max-width:220px; height:auto; display:block; margin:0 auto clamp(14px,2.2vw,20px);
    filter:drop-shadow(0 18px 30px rgba(17,17,20,.14));
    transition:transform .3s cubic-bezier(.2,.8,.3,1);
  }
  .pick:hover img, .pick:focus-visible img{ transform:scale(1.05) rotate(-1.5deg); }
  .pick.film img{ transform:rotate(3deg); }
  .pick.film:hover img, .pick.film:focus-visible img{ transform:scale(1.05) rotate(5deg); }
  .pick h2{ font-size:clamp(18px,2.4vw,23px); font-weight:800; letter-spacing:-.02em; margin:0 0 4px; }
  .pick .role{ font-family:var(--hand); font-size:clamp(15px,1.8vw,18px); font-weight:600; margin-bottom:6px; }
  .pick.design .role{ color:var(--design); }
  .pick.film .role{ color:var(--film); }
  .pick p.desc{ font-size:13px; color:var(--grey); max-width:24ch; line-height:1.5; margin:0; }
  .pick .cta{ margin-top:14px; font-size:12px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; opacity:0; transform:translateY(4px); transition:opacity .2s, transform .2s; }
  .pick.design .cta{ color:var(--design); }
  .pick.film .cta{ color:var(--film); }
  .pick:hover .cta, .pick:focus-visible .cta{ opacity:1; transform:none; }

  .divider{ font-family:var(--hand); color:var(--grey); font-size:15px; align-self:center; padding-bottom:clamp(60px,10vw,96px); }

  @media (max-width:640px){
    .picks{ flex-direction:column; align-items:center; gap:8px; }
    .pick{ width:100%; max-width:320px; }
    .pick img{ max-width:170px; }
    .divider{ display:none; }
    body{ overflow:auto; }
    .scene{ min-height:100dvh; padding-top:72px; padding-bottom:72px; }
  }

  @media (prefers-reduced-motion:reduce){
    .pick, .pick img{ transition:none; }
  }
</style>
</head>
<body>

<div class="scene">
  <span class="mark">AP</span>

  <div class="intro">
    <h1>Anjali Pal</h1>
    <p>two practices, one person — pick a lane</p>
  </div>

  <div class="picks">
    <a class="pick design" href="design/index.html">
      <img src="assets/sticker-design.svg" alt="" aria-hidden="true">
      <h2>Designer</h2>
      <span class="role">UI/UX · Product</span>
      <p class="desc">Case studies, a design system habit, and a résumé you can scroll.</p>
      <span class="cta">Enter &rarr;</span>
    </a>

    <div class="divider">or</div>

    <a class="pick film" href="film.html">
      <img src="assets/sticker-clapper.svg" alt="" aria-hidden="true">
      <h2>Filmmaker</h2>
      <span class="role">Writer · DP</span>
      <p class="desc">Writing, direction and shooting — the newer practice, still early.</p>
      <span class="cta">Enter &rarr;</span>
    </a>
  </div>

  <p class="contact"><a href="mailto:palanjali0853@gmail.com">palanjali0853@gmail.com</a></p>
</div>

</body>
</html>
