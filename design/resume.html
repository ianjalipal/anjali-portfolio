<style>
  :root{
    --bg:#FAFAFA;
    --card:#FFFFFF;
    --ink:#16181F;
    --grey:#6B7280;
    --dim:#9AA0AC;
    --line:#ECECEC;
    --line-2:#E2E2E6;
    --accent:#4F46E5;
    --accent-bright:#6366F1;
    --r-md:20px;
    --shadow:0 14px 40px -22px rgba(22,24,31,.14);
    --shadow-lg:0 34px 70px -30px rgba(22,24,31,.22);
    --font:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --wrap:1000px;
    --pad:clamp(20px,4vw,40px);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55; letter-spacing:-.011em; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  p{ margin:0; }

  .wrap{ max-width:var(--wrap); margin:0 auto; padding:0 var(--pad); }

  .nav{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px var(--pad); background:linear-gradient(var(--bg), rgba(250,250,250,.6)); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    font-size:13px; font-weight:600; letter-spacing:-.01em; color:var(--grey);
  }
  .nav a{ color:var(--grey); display:inline-flex; align-items:center; gap:6px; }
  .nav a:hover{ color:var(--accent); }

  header.hero{ text-align:center; padding:clamp(40px,7vw,72px) 0 clamp(28px,4vw,40px); }
  h1{ font-weight:800; letter-spacing:-.03em; line-height:1.1; font-size:clamp(28px,4.4vw,42px); margin:0 0 10px; }
  .sub{ color:var(--grey); font-size:15px; max-width:52ch; margin:0 auto 26px; }

  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{
    font-size:13.5px; font-weight:600; letter-spacing:-.01em; border-radius:999px; height:46px; padding:0 22px;
    display:inline-flex; align-items:center; gap:8px; transition:transform .16s ease, box-shadow .16s ease;
  }
  .btn.solid{ background:var(--ink); color:#fff; }
  .btn.solid:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .btn.line{ border:1px solid var(--line-2); background:#fff; color:var(--ink); }
  .btn.line:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }

  .viewer{
    margin:clamp(28px,5vw,48px) 0 clamp(56px,8vw,88px);
    display:flex; flex-direction:column; align-items:center; gap:clamp(16px,2.4vw,24px);
  }
  .viewer .page{
    width:100%; max-width:820px; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); box-shadow:var(--shadow-lg); background:var(--card); line-height:0;
  }
  .viewer canvas{ display:block; width:100%; height:auto; }

  .fallback{ padding:48px var(--pad); text-align:center; color:var(--grey); font-size:14px; }
  .fallback a{ color:var(--accent); font-weight:600; }
  .loading{ padding:64px var(--pad); text-align:center; color:var(--dim); font-size:13.5px; }

  footer{ padding:0 0 clamp(40px,6vw,64px); text-align:center; }
  .foot-fine{ font-size:12.5px; color:var(--dim); }
  .foot-fine a{ color:var(--grey); }
  .foot-fine a:hover{ color:var(--accent); }

</style>
</head>
<body>

<nav class="nav">

</nav>

<div class="wrap">
  <header class="hero">
    <h1>Résumé</h1>
    <p class="sub">Product Designer — view it below, or download the PDF.</p>
    <div class="actions">
      <a class="btn solid" href="assets/resume/Anjali-Pal-Product-Designer.pdf" download>
        Download PDF
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v13M7 12l5 5 5-5M5 21h14"/></svg>
      </a>
      <a class="btn line" href="assets/resume/Anjali-Pal-Product-Designer.pdf" target="_blank" rel="noopener">
        Open in New Tab
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </div>
  </header>

  <div class="viewer" id="viewer">
    <p class="loading" id="loading">Loading résumé…</p>
  </div>
</div>

<footer>
  <p class="foot-fine"><a href="index.html">&larr; Back to portfolio</a></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

  var PDF_URL = "assets/resume/Anjali-Pal-Product-Designer.pdf";
  var viewer = document.getElementById("viewer");
  var loading = document.getElementById("loading");

  async function render() {
    try {
      var doc = await pdfjsLib.getDocument(PDF_URL).promise;
      loading.remove();
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      for (var i = 1; i <= doc.numPages; i++) {
        var page = await doc.getPage(i);
        var baseViewport = page.getViewport({ scale: 1 });
        var targetWidth = Math.min(820, viewer.clientWidth || 820);
        var scale = (targetWidth / baseViewport.width) * dpr;
        var viewport = page.getViewport({ scale: scale });

        var canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var ctx = canvas.getContext("2d");

        var wrap = document.createElement("div");
        wrap.className = "page";
        wrap.appendChild(canvas);
        viewer.appendChild(wrap);

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      }
    } catch (err) {
      loading.textContent = "";
      var p = document.createElement("p");
      p.className = "fallback";
      p.innerHTML = "Couldn't load the résumé preview. <a href=\"" + PDF_URL + "\">Open the PDF directly</a> instead.";
      viewer.appendChild(p);
    }
  }
  render();
</script>

</body>
