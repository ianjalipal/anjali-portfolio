<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 22" shape-rendering="crispEdges">
  <!-- raised arms (skin) -->
  <g fill="#f1c290">
    <rect x="2" y="3" width="2" height="6"/>
    <rect x="12" y="3" width="2" height="6"/>
  </g>
  <!-- cap -->
  <g fill="#d63a2e">
    <rect x="5" y="1" width="6" height="1"/>
    <rect x="4" y="2" width="8" height="2"/>
    <rect x="3" y="4" width="10" height="1"/>
  </g>
  <rect x="10" y="3" width="2" height="1" fill="#b32b22"/>
  <!-- hair -->
  <g fill="#3b2a1c">
    <rect x="4" y="5" width="1" height="2"/>
    <rect x="11" y="5" width="1" height="2"/>
  </g>
  <!-- face -->
  <rect x="5" y="5" width="6" height="3" fill="#f1c290"/>
  <rect x="6" y="6" width="1" height="1" fill="#2a2118"/>
  <rect x="9" y="6" width="1" height="1" fill="#2a2118"/>
  <!-- shirt collar -->
  <rect x="6" y="8" width="4" height="1" fill="#d63a2e"/>
  <!-- backpack / body -->
  <g fill="#e6b94e">
    <rect x="4" y="9" width="8" height="4"/>
  </g>
  <rect x="5" y="10" width="6" height="2" fill="#c99a33"/>
  <!-- belt -->
  <rect x="4" y="13" width="8" height="1" fill="#3b2a1c"/>
  <!-- legs -->
  <g fill="#3a5bd0">
    <rect x="4" y="14" width="3" height="5"/>
    <rect x="9" y="14" width="3" height="5"/>
  </g>
  <!-- shoes -->
  <g fill="#2a2118">
    <rect x="3" y="19" width="4" height="2"/>
    <rect x="9" y="19" width="4" height="2"/>
  </g>
</svg>
